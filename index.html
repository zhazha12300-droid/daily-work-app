<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>工作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6feb'/%3E%3Ctext x='16' y='22' font-size='15' font-family='sans-serif' font-weight='600' text-anchor='middle' fill='white'%3EW%3C/text%3E%3C/svg%3E"
    />
    <script>
      // 在首帧之前套用主题，避免刷新时闪白
      try {
        var t = localStorage.getItem('wb-theme')
        if (t === 'dark' || t === 'light') {
          document.documentElement.dataset.theme = t
          document.documentElement.style.colorScheme = t
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
